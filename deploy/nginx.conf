server {
    listen 80;

    # SSE 流式必须关闭缓冲
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
